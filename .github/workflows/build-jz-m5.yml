name: Build JZ M5 Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile FerrisPulse (C# 5.0)
        shell: cmd
        run: build.bat

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: FerrisPulse-JZ-M5
          path: FerrisPulse.exe
