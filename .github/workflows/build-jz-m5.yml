name: Build JZ M5

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Branch to build'
        required: false
        default: 'feat/jz-m5-wireless-link-km'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || 'feat/jz-m5-wireless-link-km' }}

      - name: Compile FerrisPulse (C# 5.0)
        shell: cmd
        run: build.bat

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: FerrisPulse-JZ-M5
          path: FerrisPulse.exe
