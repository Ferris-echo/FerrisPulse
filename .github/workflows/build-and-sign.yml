name: Build and Sign Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signing_policy:
        description: 'SignPath 签名策略 (Signing Policy)'
        required: true
        default: 'test-signing'
        type: choice
        options:
          - test-signing
          - release-signing
      release_tag:
        description: '发布到 GitHub Releases 的版本号 (如 v2.2.0，留空则仅构建签名不发 Release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 编译原生开源二进制 (build.bat)
        shell: cmd
        run: |
          build.bat

      - name: 运行全量自动化测试
        shell: powershell
        run: |
          .\tools\run_all_tests.ps1

      - name: 上传待签名构建产物
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifact
          path: FerrisPulse.exe

      - name: 提交 SignPath 权威云端签名 (配置凭据后激活)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'FerrisPulse'
          signing-policy-slug: ${{ inputs.signing_policy || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed-output'

      - name: 替换为已签名的二进制文件
        if: env.SIGNPATH_API_TOKEN != ''
        shell: powershell
        run: |
          Write-Host "检查 SignPath 返回的产物结构:"
          Get-ChildItem -Path signed-output -Recurse | Format-Table FullName, Length
          if (Test-Path "signed-output\FerrisPulse.exe") {
            Copy-Item -Path signed-output\FerrisPulse.exe -Destination FerrisPulse.exe -Force
          } else {
            $zip = Get-ChildItem -Path signed-output -Filter "*.zip" | Select-Object -First 1
            if ($zip) {
              Expand-Archive -Path $zip.FullName -DestinationPath signed-extracted -Force
              if (Test-Path "signed-extracted\FerrisPulse.exe") {
                Copy-Item -Path signed-extracted\FerrisPulse.exe -Destination FerrisPulse.exe -Force
              }
            }
          }
          Write-Host "已加载权威数字签名:"
          Get-AuthenticodeSignature FerrisPulse.exe | Format-List

      - name: 打包便携版 ZIP (Portable Release)
        shell: powershell
        run: |
          $ver = "${{ inputs.release_tag || github.ref_name }}"
          if ([string]::IsNullOrEmpty($ver) -or $ver -notmatch '^v') { $ver = "v2.2.0" }
          .\tools\build_release_zip.ps1 -Version $ver

      - name: 上传已签名最终成品 (Signed Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FerrisPulse-Signed-Package
          path: |
            FerrisPulse.exe
            FerrisPulse_*_Portable.zip

      - name: 发布至 GitHub Releases 附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (inputs.release_tag != '' && inputs.release_tag != null)
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag != '' && format('FerrisPulse · 灵脉 {0}', inputs.release_tag) || '' }}
          files: |
            FerrisPulse.exe
            FerrisPulse_*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}